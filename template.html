<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #fbfaf7;
  --ink: #1f1d1a;
  --muted: #6b665e;
  --rule: #ddd8cd;
  --accent: #9b2c1f;
  --quote-bg: #f3f0e8;
  --bar-bg: rgba(31, 29, 26, .92);
  --bar-ink: #f4f1ea;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --cjk: "Songti TC", "Noto Serif CJK TC", "Noto Serif TC", "Source Han Serif TC", "PMingLiU", "MingLiU", serif;
  --small: .889rem; /* 2 px below the 18 px body text */
  --sans: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 112.5%; scroll-padding-top: 1.5rem; }
@media (min-width: 700px) { html.present { font-size: 137.5%; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); line-height: 1.6;
  padding: 0 1rem 70vh;
  -webkit-text-size-adjust: 100%;
}
main, header { max-width: 42rem; margin: 0 auto; }
html.present main, html.present header { max-width: 46rem; }
header { padding-top: 3rem; }
h1 { font-size: clamp(1.4rem, 5.5vw, 1.9rem); line-height: 1.2; margin: 0 0 .5rem; text-wrap: balance; overflow-wrap: break-word; }
.author { color: var(--muted); margin: 0; }
.event { color: var(--muted); font-size: var(--small); margin: .35rem 0 0; text-wrap: balance; }
h2 { font-size: 1.35rem; margin: 3rem 0 1rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
p { margin: 0 0 1rem; hyphens: auto; }
main > p, main li, .slide p { text-align: justify; }
a { color: var(--accent); text-underline-offset: .15em; }
ul, ol { padding-left: 1.4rem; }
li { margin-bottom: .35rem; }
sup { line-height: 0; }
.footnote-ref { text-decoration: none; padding: 0 .1em; }
[lang^="zh"] { font-family: var(--cjk); }
html.no-zh .zh { display: none; }

/* Slides (waypoints) */
.slide { position: relative; margin: 1.75rem 0; transition: opacity .3s; }
.slide::before {
  content: attr(data-n);
  position: absolute; left: -3.2rem; top: .1rem; width: 2.2rem;
  text-align: right; font: 600 .7rem/1.6 var(--sans);
  color: var(--muted); letter-spacing: .04em;
}
.slide.active::before { color: var(--accent); }
@media (max-width: 52rem) { .slide::before { display: none; } }

blockquote {
  margin: 0 0 1rem; padding: 1rem 1.25rem .25rem;
  background: var(--quote-bg); border-left: 3px solid var(--rule);
  font-size: var(--small);
}
.slide.active blockquote { border-left-color: var(--accent); }
blockquote .zh-line { font-size: 1.05em; line-height: 1.75; margin-bottom: .35rem; text-align: justify; }
blockquote .zh-line + p { margin-bottom: 1.15rem; }

img { display: block; max-width: 100%; height: auto; max-height: 82vh; margin: 0 auto .75rem; }
img[src$=".svg"] { width: 100%; object-fit: contain; }
img[src$="fig_01.svg"] { width: 75%; }
.caption { font-size: var(--small); color: var(--muted); }

table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-bottom: .75rem; }
th, td { text-align: left; vertical-align: top; padding: .4rem .6rem; border-bottom: 1px solid var(--rule); }
thead th { font-family: var(--sans); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 2px solid var(--ink); }
tbody th { font-weight: 600; border-right: 1px solid var(--rule); }
.table-wrap { overflow-x: auto; }

.footnotes { font-size: var(--small); color: #3b3833; overflow-wrap: break-word; }
.footnotes ol { padding-left: 1.6rem; }
.footnote-back { text-decoration: none; margin-left: .25em; }

/* Presentation mode: everything but the current slide recedes */
html.present main > *, html.present header { opacity: .22; transition: opacity .3s; }
html.present main > .slide.active { opacity: 1; }
html.present.no-active main > *, html.present.no-active header { opacity: 1; }

/* Control bar */
.bar {
  position: fixed; right: 1rem; bottom: 1rem; z-index: 10;
  display: flex; align-items: center; gap: .25rem;
  padding: .3rem; border-radius: .6rem;
  background: var(--bar-bg); color: var(--bar-ink);
  font: 500 14px/1 var(--sans);
  box-shadow: 0 4px 18px rgba(0, 0, 0, .25);
  transition: opacity .3s;
}
html.present .bar { opacity: .3; }
html.present .bar:hover, html.present .bar:focus-within { opacity: 1; }
.bar button {
  appearance: none; border: 0; background: transparent; color: inherit; font: inherit;
  min-width: 36px; height: 36px; padding: 0 10px; border-radius: 6px; cursor: pointer;
}
.bar button:hover { background: rgba(255, 255, 255, .14); }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
.bar button[aria-pressed="true"] { background: var(--bar-ink); color: var(--ink); }
.bar button:disabled { opacity: .35; cursor: default; background: transparent; }
.bar .count { min-width: 62px; text-align: center; font-variant-numeric: tabular-nums; }
.bar .sep { width: 1px; height: 22px; background: rgba(255, 255, 255, .25); margin: 0 .2rem; }
.bar .zh-btn { font-family: var(--cjk); font-size: 16px; }

@media (max-width: 480px) {
  .bar { left: 8px; right: 8px; bottom: 8px; justify-content: space-between; }
  .bar button { padding: 0 6px; }
  .bar .count { min-width: 50px; }
}
@media print {
  .bar { display: none; }
  body { padding-bottom: 0; }
  .slide::before { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
{{HEADER}}
<main>
{{BODY}}
</main>

<nav class="bar" aria-label="Diapositives">
  <button type="button" id="prev" title="Diapositive précédente (←)" aria-label="Diapositive précédente">◀</button>
  <span class="count" id="count" aria-live="polite"></span>
  <button type="button" id="next" title="Diapositive suivante (→)" aria-label="Diapositive suivante">▶</button>
  <span class="sep"></span>
  <button type="button" id="zh" class="zh-btn" aria-pressed="true" title="Afficher / masquer les caractères chinois (C)">漢字</button>
  <button type="button" id="present" aria-pressed="false" title="Mode présentation (P)">Présentation</button>
</nav>

<script>
(function () {
  var root = document.documentElement;
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
  var zhBtn = document.getElementById('zh'), presentBtn = document.getElementById('present');
  var count = document.getElementById('count');
  var current = 0;          // 1-based; 0 = before the first slide
  var autoScroll = false, autoTimer = null;

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { return null; }
  }

  function render() {
    slides.forEach(function (s, i) { s.classList.toggle('active', i + 1 === current); });
    root.classList.toggle('no-active', current === 0);
    count.textContent = (current || '–') + ' / ' + slides.length;
    count.title = current ? (slides[current - 1].dataset.label || '') : '';
    prevBtn.disabled = current <= 1;
    nextBtn.disabled = current >= slides.length;
  }

  function scrollToSlide(el, smooth) {
    // Short slides are centred; long ones start at the top of the window.
    var fits = el.getBoundingClientRect().height < window.innerHeight - 48;
    autoScroll = true;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(function () { autoScroll = false; }, 1200);
    el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: fits ? 'center' : 'start' });
  }

  function go(n, smooth) {
    if (n < 1 || n > slides.length) return;
    current = n;
    render();
    scrollToSlide(slides[n - 1], smooth !== false);
    try { history.replaceState(null, '', '#slide-' + n); } catch (e) {}
  }

  // When the reader scrolls by hand, follow along so ◀ ▶ start from where they are.
  function track() {
    if (autoScroll) return;
    var line = window.innerHeight * 0.55, found = 0;
    for (var i = 0; i < slides.length; i++) {
      if (slides[i].getBoundingClientRect().top < line) found = i + 1; else break;
    }
    if (found !== current) { current = found; render(); }
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; track(); });
  }, { passive: true });
  window.addEventListener('scrollend', function () { autoScroll = false; clearTimeout(autoTimer); });

  function setZh(on) {
    root.classList.toggle('no-zh', !on);
    zhBtn.setAttribute('aria-pressed', String(on));
    store('zh', on ? '1' : '0');
  }
  function setPresent(on) {
    root.classList.toggle('present', on);
    presentBtn.setAttribute('aria-pressed', String(on));
    store('present', on ? '1' : '0');
    if (current) scrollToSlide(slides[current - 1], false);   // font size changed
  }
  function toggleZh() {
    var anchor = current ? slides[current - 1] : null;
    setZh(root.classList.contains('no-zh'));
    if (anchor && root.classList.contains('present')) scrollToSlide(anchor, false);
  }

  prevBtn.addEventListener('click', function () { go(current - 1); });
  nextBtn.addEventListener('click', function () { go(current + 1); });
  zhBtn.addEventListener('click', toggleZh);
  presentBtn.addEventListener('click', function () { setPresent(!root.classList.contains('present')); });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    var presenting = root.classList.contains('present');
    var k = e.key;
    if (k === 'ArrowRight' || (presenting && (k === 'PageDown' || k === ' ' && !e.shiftKey))) {
      if (k === ' ' && t && t.tagName === 'BUTTON') return;
      e.preventDefault(); go(current + 1);
    } else if (k === 'ArrowLeft' || (presenting && (k === 'PageUp' || k === ' ' && e.shiftKey))) {
      if (k === ' ' && t && t.tagName === 'BUTTON') return;
      e.preventDefault(); go(current - 1);
    } else if (k === 'c' || k === 'C') {
      toggleZh();
    } else if (k === 'p' || k === 'P') {
      setPresent(!presenting);
    }
  });

  // Tables scroll sideways on narrow screens instead of the page.
  Array.prototype.forEach.call(document.querySelectorAll('table'), function (t) {
    var w = document.createElement('div');
    w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });

  setZh(store('zh') !== '0');
  if (store('present') === '1') { root.classList.add('present'); presentBtn.setAttribute('aria-pressed', 'true'); }
  var m = /^#slide-(\d+)$/.exec(location.hash);
  if (m && slides[+m[1] - 1]) {
    current = +m[1];
    render();
    window.addEventListener('load', function () { scrollToSlide(slides[current - 1], false); });
  } else {
    render();
    track();
  }
})();
</script>
</body>
</html>
